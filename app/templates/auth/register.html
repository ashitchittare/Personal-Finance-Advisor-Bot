{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5 0%, #818cf8 100%); display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-wallet2 text-white fs-4"></i>
                        </div>
                        <h4 class="fw-bold">Create Free Account</h4>
                        <p class="text-muted small">Start managing your personal finances in ₹ INR</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="full_name" class="form-label small fw-semibold">Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" placeholder="e.g. Aarav Sharma">
                            </div>
                            <div class="col-sm-6">
                                <label for="occupation" class="form-label small fw-semibold">Occupation / Role</label>
                                <input type="text" class="form-control" id="occupation" name="occupation" value="{{ occupation or '' }}" placeholder="e.g. Student / Engineer">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">@</span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="choose_username" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="user@example.com" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirm_password" class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Complete Registration <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">
                            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
