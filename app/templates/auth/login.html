{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5 0%, #818cf8 100%); display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-wallet2 text-white fs-4"></i>
                        </div>
                        <h4 class="fw-bold">Sign In to FinBot</h4>
                        <p class="text-muted small">Access your personal finance dashboard</p>
                    </div>

                    <!-- Quick Demo Credentials Fill -->
                    <div class="alert alert-info py-2 px-3 small d-flex align-items-center justify-content-between mb-4 border-0">
                        <div>
                            <strong>Demo User:</strong> <code>aarav</code> / <code>password123</code>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-info py-0 px-2" onclick="document.getElementById('login_identifier').value='aarav'; document.getElementById('password').value='password123';">
                            Auto Fill
                        </button>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                        <div class="mb-3">
                            <label for="login_identifier" class="form-label small fw-semibold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="login_identifier" name="login_identifier" placeholder="e.g. aarav or user@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Remember me on this device</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">
                            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
